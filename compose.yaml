services:
  rabbit-source:
    image: rabbitmq:3.13-management
    hostname: rabbit-source
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: user
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - source_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbit-target:
    image: rabbitmq:3.13-management
    hostname: rabbit-target
    environment:
      RABBITMQ_DEFAULT_USER: user2
      RABBITMQ_DEFAULT_PASS: user2
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - target_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    environment:
      SOURCE_RABBITMQ_HOST: rabbit-source
      SOURCE_RABBITMQ_PORT: "5672"
      SOURCE_RABBITMQ_USER: user
      SOURCE_RABBITMQ_PASSWORD: user
      SOURCE_RABBITMQ_VHOST: /
      SOURCE_RABBITMQ_QUEUE: incoming
      TARGET_RABBITMQ_HOST: rabbit-target
      TARGET_RABBITMQ_PORT: "5672"
      TARGET_RABBITMQ_USER: user
      TARGET_RABBITMQ_PASSWORD: user
      TARGET_RABBITMQ_VHOST: /
      TARGET_RABBITMQ_QUEUE: processed
      PREFETCH_COUNT: "10"
      LOG_LEVEL: INFO
    depends_on:
      rabbit-source:
        condition: service_healthy
      rabbit-target:
        condition: service_healthy
    restart: unless-stopped

volumes:
  source_data:
  target_data:
